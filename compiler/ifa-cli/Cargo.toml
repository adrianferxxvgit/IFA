[package]
name = "ifa-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }

[[bin]]
name = "ifa-cli"
path = "src/main.rs"

[[bin]]
name = "ifa-migrate"
path = "src/migrate.rs"
[[bin]]
name = "ifa-query"
path = "src/query.rs"
[[bin]]
name = "ifa-backtest"
path = "src/backtest.rs"